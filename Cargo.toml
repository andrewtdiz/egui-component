[package]
name = "egui-component-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Host binaries for the egui-component JSX runtime showcase."

[workspace]
members = [
    ".",
    "crates/clay-jsx-runtime",
    "crates/clay-jsx-egui-bridge",
    "crates/egui-component",
]
resolver = "2"

[dependencies]
clay-jsx-egui-bridge = { path = "crates/clay-jsx-egui-bridge" }
clay-jsx-runtime = { path = "crates/clay-jsx-runtime" }
egui = "0.33.3"
egui-component = { path = "crates/egui-component" }
eframe = "0.33.3"
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.145"
tempfile = "3.16.0"

[package]
name = "luau-runtime-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Portable Luau runtime core for Rust hosts."

[lib]
path = "src/lib.rs"

[dependencies]
notify = "6"
log = { version = "0.4.28", default-features = false }
mlua = { version = "0.11.6", default-features = false, features = ["luau"] }
parking_lot = { version = "0.12.5", features = ["arc_lock"] }

[dev-dependencies]
tempfile = "3.16.0"

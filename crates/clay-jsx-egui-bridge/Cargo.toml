[package]
name = "clay-jsx-egui-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "egui-component contract bridge for clay-jsx-runtime TS/TSX hosts."
readme = "README.md"

[dependencies]
anyhow = "1.0.100"
clay-jsx-runtime = { path = "../clay-jsx-runtime" }
egui-component = { path = "../egui-component" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[build-dependencies]
deno_ast = { version = "=0.53.1", features = ["transpiling"] }

[dev-dependencies]
tempfile = "3.16.0"

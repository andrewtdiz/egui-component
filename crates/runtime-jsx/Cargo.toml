[package]
name = "egui-component-runtime-jsx"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Reusable deno_core-backed TS/TSX JSX runtime for egui-component contract hosts."
readme = "README.md"

[dependencies]
anyhow = "1.0.100"
deno_ast = { version = "=0.53.1", features = ["transpiling"] }
deno_core = "0.398.0"
deno_error = "0.7.0"
egui-component = { path = "../.." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.16.0"
